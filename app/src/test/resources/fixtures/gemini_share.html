<!DOCTYPE html>
<html>
<head>
  <title>Tips for better photos – Gemini</title>
</head>
<body>
  <main>
    <!-- Rendered share page (what the hidden WebView would see). -->
    <div class="conversation-container">
      <div class="user-query">
        <div class="query-content">
          <div class="query-text">How do I take better photos with my phone?</div>
        </div>
      </div>
      <model-response>
        <div class="response-container">
          <div class="response-container-content">
            <p>Use natural light whenever you can.</p>
            <ul>
              <li>Wipe the lens first</li>
              <li>Tap to focus</li>
            </ul>
            <p>Avoid digital zoom; crop later instead.</p>
          </div>
        </div>
      </model-response>
    </div>
    <div class="conversation-container">
      <div class="user-query">
        <div class="query-content"><div class="query-text">What about night shots?</div></div>
      </div>
      <model-response>
        <div class="response-container">
          <div class="response-container-content">
            <p>Use night mode and brace the phone against something solid.</p>
          </div>
        </div>
      </model-response>
    </div>
  </main>
</body>
</html>
